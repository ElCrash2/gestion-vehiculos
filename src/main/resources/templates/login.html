<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Gestión de vehículos</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-page">
<main class="login-card">
  <h1>Gestión de vehículos</h1>
  <p class="muted">Inicia sesión con tu cuenta para continuar.</p>
  <div class="notice error" th:if="${param.error}">Usuario o contraseña incorrectos.</div>
  <div class="notice" th:if="${param.logout}">Has cerrado la sesión correctamente.</div>
  <form th:action="@{/login}" method="post">
    <div class="field">
      <label for="username">Usuario</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="button" type="submit">Entrar</button>
  </form>
</main>
</body>
</html>
